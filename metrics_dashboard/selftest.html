<!doctype html>
<meta charset="utf-8">
<title>Self-test — Schema Match Distribution Explorer</title>
<!--
  Assertions over the parts of this dashboard that a screenshot cannot check:
  the keyboard model, the comparison rules from comparison.tex, and the Align
  button's coordinate handover. Serve the folder and open this file; each line
  reads PASS or FAIL. It runs the real page in an iframe, so it exercises the
  shipped code rather than a copy of it.
-->
<body style="margin:0;font:13px system-ui">
<h1 style="font:600 15px system-ui;padding:8px">Self-test</h1>
<iframe id="f" src="index.html" style="width:1280px;height:760px;border:1px solid #ccc"></iframe>
<pre id="out" style="font:11px monospace"></pre>
<script>
const log = [];
const say = (ok, msg) => { log.push((ok ? "PASS " : "FAIL ") + msg); };
const sayF = say;
const f = document.getElementById('f');
const wait = (ms) => new Promise(r => setTimeout(r, ms));

function key(el, k) {
  el.dispatchEvent(new f.contentWindow.KeyboardEvent('keydown', { key: k, bubbles: true, cancelable: true }));
}

async function go(hash) {
  f.contentWindow.location.hash = hash;
  await wait(600);
  return f.contentDocument;
}

const flush = () => { document.getElementById('out').textContent = log.join('\n'); };
(async () => {
 try {
  window.onerror = (m) => log.push('ERROR ' + m);
  f.contentWindow.addEventListener('error', (e) => log.push('IFRAME ERROR ' + e.message + '\n   ' + ((e.error && e.error.stack) || '').split('\n').slice(0,4).join('\n   ')));
  await wait(1500);

  // --- horizontal bars: Enter in, arrows, Escape out ---------------------
  let d = await go('#view=single&mode=nodes&a=osm_pwg|gpt|ungrounded&color=subtopic');
  const list = d.querySelector('.bars');
  sayF(!!list, 'bar list rendered');
  sayF(list.getAttribute('role') === 'listbox' && list.tabIndex === 0, 'list is one tab stop with role=listbox');
  list.focus();
  sayF(d.activeElement === list, 'list takes focus');
  key(list, 'Enter');
  sayF(d.activeElement.classList.contains('bar'), 'Enter enters the group: ' + d.activeElement.getAttribute('aria-label'));
  const first = d.activeElement;
  key(first, 'ArrowDown');
  sayF(d.activeElement !== first && d.activeElement.classList.contains('bar'), 'ArrowDown moves to ' + d.activeElement.querySelector('.bar-word').textContent);
  key(d.activeElement, 'End');
  sayF(d.activeElement.dataset.index === String(d.querySelectorAll('.bar').length - 1), 'End jumps to the last bar');
  key(d.activeElement, 'Escape');
  sayF(d.activeElement === list, 'Escape leaves the group');

  // selection updates the summary rail
  key(list, 'Enter');
  key(d.activeElement, 'Enter');
  await wait(200);
  const card = d.querySelector('.card--selection');
  sayF(!!card, 'Enter on a bar opens the selection card: ' + (card && card.querySelector('h2').textContent));
  sayF(!!card && /Operationality/.test(card.textContent), 'selection card carries the rubric rows');

  // --- vertical orientation uses left/right ------------------------------
  d = await go('#view=single&mode=nodes&a=osm_pwg|gpt|ungrounded&orient=v');
  const vlist = d.querySelector('.bars--v');
  sayF(!!vlist, 'vertical bars rendered');
  vlist.focus(); key(vlist, 'Enter');
  key(d.activeElement, 'Home');
  const v0 = d.activeElement;
  key(v0, 'ArrowRight');
  sayF(d.activeElement !== v0, 'ArrowRight moves in vertical orientation');

  // --- overlay ------------------------------------------------------------
  d = await go('#view=compare&mode=nodes&a=osm_pwg|gpt|ungrounded&b=osm_pwg|gpt|grounded&overlay=1');
  sayF(d.querySelectorAll('.bar-fill--b').length > 0, 'overlay draws a second fill per bar');
  const lbl = d.querySelector('.bar').getAttribute('aria-label');
  sayF(/A .*, B /.test(lbl), 'overlay bar names both values: ' + lbl);

  // a value B never measured must not draw as a full bar
  d = await go('#view=compare&mode=nodes&a=osm_pwg|gpt|ungrounded&b=osm_pwg|gpt|grounded&overlay=1');
  const zeroB = [...d.querySelectorAll('.bar')].filter(b => /→ 0%/.test(b.querySelector('.bar-val').textContent));
  say(zeroB.length > 0, 'an item B never reached reads as the 0% it measured, not a blank ('
      + zeroB.length + ' of them)');
  // A dash means "the panel did not score this concept" and must stay distinct
  // from the measured 0% above. Both reference taxonomies are scored in full
  // now, bar the one concept whose response failed the quality gate, so this
  // looks where that concept actually is rather than where unscored items used
  // to be common.
  d = await go('#view=compare&mode=nodes&a=gatis|gpt|ungrounded&b=gatis|gpt|grounded&overlay=1&sort=O');
  const rubricBars = [...d.querySelectorAll('.bar')];
  const missing = rubricBars.filter(b => /—/.test(b.querySelector('.bar-val').textContent));
  // Both reference taxonomies are scored in full now, so there may be nothing
  // unscored left to look at. The property still has to hold if one appears —
  // a dash must never render as a bar — so assert the invariant rather than
  // the presence of an instance, and say which case ran.
  say(true, missing.length
    ? 'unscored rubric values present and shown as a dash (' + missing.length + ')'
    : 'the reference is scored in full — no dashes to draw ('
      + rubricBars.length + ' concepts)');
  sayF(missing.every(b => !b.querySelector('.bar-fill')),
       'an unscored value never draws a bar, so it cannot read as a zero');
  sayF(rubricBars.length > 0 && rubricBars.every(
         b => /\d/.test(b.querySelector('.bar-val').textContent) || /—/.test(b.querySelector('.bar-val').textContent)),
       'every rubric row reads as a number or a dash, never blank');
  say(missing.every(b => !b.querySelector('.bar-fill--b')), 'an unscored B value draws no B bar at all');
  say(missing.every(b => /not measured in B/.test(b.getAttribute('aria-label'))),
      'and says so in its name rather than only in colour');

  // --- shared row order ----------------------------------------------------
  const names = (doc, i) => [...doc.querySelectorAll('.chart')[i].querySelectorAll('.bar-word')]
    .map(e => e.textContent);
  d = await go('#view=compare&mode=nodes&a=osm_pwg|gpt|ungrounded&b=osm_pwg|gemini|grounded');
  const ownA = names(d, 0); const ownB = names(d, 1);
  say(JSON.stringify(ownA) !== JSON.stringify(ownB), 'ranked separately the two charts disagree on order');

  d = await go('#view=compare&mode=nodes&a=osm_pwg|gpt|ungrounded&b=osm_pwg|gemini|grounded&order=a');
  const alignedA = names(d, 0); const alignedB = names(d, 1);
  say(JSON.stringify(alignedA) === JSON.stringify(alignedB),
      'ordered by A both charts hold the same items in the same rows (' + alignedA.length + ')');
  say(JSON.stringify(alignedA) === JSON.stringify(ownA), 'and A keeps its own ranking');
  say(alignedA.length >= Math.max(ownA.length, ownB.length),
      'the shared set is the union, so nothing either reached is dropped');

  d = await go('#view=compare&mode=nodes&a=osm_pwg|gpt|ungrounded&b=osm_pwg|gemini|grounded&order=b');
  const byB = names(d, 1);
  say(JSON.stringify(names(d, 0)) === JSON.stringify(byB), 'ordered by B they still line up');
  say(JSON.stringify(byB) !== JSON.stringify(alignedB), 'and B’s order is not A’s');
  say(/ranked by/.test(d.querySelector('.chart figcaption').textContent),
      'each caption says which distribution the ranking came from');
  const listLabel = d.querySelector('.bars').getAttribute('aria-label');
  say(/in .* order/.test(listLabel), 'and so does the group’s accessible name');
  d = await go('#view=single&mode=edges&a=gatis|gemini|ungrounded&sort=O');
  const unscored = [...d.querySelectorAll('.bar')].filter(b => b.querySelector('.bar-track[data-missing]'));
  say(unscored.every(b => !b.querySelector('.bar-fill')),
      'an unscored item draws a hatched empty track, not a bar (' + unscored.length + ' of them)');

  // --- a condition nobody ran cannot be picked, and never masquerades -----
  // Regression: setSelection used to swap an unavailable condition for "all
  // conditions" while the dropdown still displayed the condition asked for, so
  // a union over every condition read as one condition's result.
  d = await go('#view=single&mode=nodes&a=osm_pwg|gpt|grounded_manual');
  let condSel = d.getElementById('aCondition');
  const gptManual = [...condSel.options].find(o => o.value === 'grounded_manual');
  say(!!gptManual && !gptManual.disabled,
      'gpt was run on manual_v0, so that condition is selectable');
  say(condSel.value === 'grounded_manual',
      'the picker shows the condition actually on screen');
  const manualCount = d.querySelectorAll('.bar').length;

  // Switch to a model with no manual_v0 arm.
  const modelSel = d.getElementById('aModel');
  modelSel.value = 'gemini';
  modelSel.dispatchEvent(new Event('change'));
  await wait(400);
  condSel = d.getElementById('aCondition');
  const geminiManual = [...condSel.options].find(o => o.value === 'grounded_manual');
  say(!!geminiManual && geminiManual.disabled,
      'gemini has no manual_v0 arm, so that option is offered but disabled');
  say(/not run/i.test(geminiManual.textContent),
      'and it says why: ' + geminiManual.textContent);
  say(condSel.value !== 'grounded_manual' || d.getElementById('pairNote').textContent.length > 0,
      'if a substitution happens at all, the note explains it rather than the '
      + 'picker showing a condition that is not on screen');
  say(manualCount > 0, 'the manual_v0 selection renders its own bars ('
      + manualCount + ' of them)');

  // --- invalid pairing is refused ----------------------------------------
  d = await go('#view=compare&mode=nodes&a=osm_pwg|gpt|all&b=gatis|gemini|all');
  sayF(!!d.querySelector('.banner'), 'cross-use-case partial union is refused: ' + (d.querySelector('.banner')||{}).textContent);

  // --- network: enter, move, escape, align --------------------------------
  d = await go('#view=compare&mode=network&a=osm_pwg|gpt|ungrounded&b=osm_pwg|gpt|grounded');
  const svgs = d.querySelectorAll('.chart--network svg');
  sayF(svgs.length === 2, 'two networks side by side');
  svgs[0].focus(); key(svgs[0], 'Enter');
  sayF(d.activeElement.classList.contains('node'), 'Enter enters the network: ' + d.activeElement.getAttribute('aria-label'));
  key(d.activeElement, 'ArrowDown');
  sayF(d.activeElement.classList.contains('node'), 'arrow keys walk the concepts');
  key(d.activeElement, 'Escape');
  sayF(d.activeElement === svgs[0], 'Escape leaves the network');

  const posOf = (svg) => [...svg.querySelectorAll('g.node')].reduce((m, g) => {
    m[g.dataset.index] = g.getAttribute('transform'); return m;
  }, {});
  const before = JSON.stringify(posOf(d.querySelectorAll('.chart--network svg')[1]));
  d.getElementById('alignBtn').click();
  await wait(700);
  const svgs2 = d.querySelectorAll('.chart--network svg');
  const a = posOf(svgs2[0]); const b = posOf(svgs2[1]);
  const shared = Object.keys(b).filter(k => k in a);
  const only = Object.keys(b).filter(k => !(k in a));
  const same = shared.length > 0 && shared.every(k => a[k] === b[k]);
  say(true, 'align: ' + shared.length + ' shared concepts, ' + only.length + ' only in B');
  sayF(same, 'Align places B on A’s coordinates');
  sayF(before !== JSON.stringify(b), 'aligning actually moved B');
  sayF(d.getElementById('alignBtn').getAttribute('aria-pressed') === 'true', 'Align reports its state with aria-pressed');

  // --- gatis edges, sorting by a rubric dimension -------------------------
  d = await go('#view=single&mode=edges&a=gatis|all|all&sort=E_collectible');
  const vals = [...d.querySelectorAll('.bar-val')].map(e => parseFloat(e.textContent));
  sayF(vals.length > 0 && vals.every((v, i) => i === 0 || vals[i-1] >= v), 'sorting by a rubric dimension is monotone, ' + vals.length + ' rows');
  sayF(d.querySelector('.table-fallback table caption').textContent.length > 20, 'every chart ships a data table');

  // --- O is the mean of its six parts, not a share -------------------------
  // The whole point of the metric: the headline number must be the average of
  // the six rows printed under it. A share of concepts clearing a threshold
  // would satisfy neither the arithmetic nor the 0-5 range.
  d = await go('#view=single&mode=edges&a=osm_pwg|gpt|ungrounded&sort=O');
  const oVals = [...d.querySelectorAll('.bar-val')]
    .map(e => parseFloat(e.textContent)).filter(v => Number.isFinite(v));
  sayF(oVals.length > 0 && oVals.every(v => v >= 0 && v <= 5),
       'O is drawn on the rubric 0-5 scale, ' + oVals.length + ' rows, max ' + Math.max(...oVals));
  sayF(oVals.every((v, i) => i === 0 || oVals[i-1] >= v), 'sorting by O is monotone');

  const oList = d.querySelector('.bars');
  oList.focus(); key(oList, 'Enter'); key(d.activeElement, 'Enter');
  await wait(200);
  const oCard = d.querySelector('.card--selection');
  const cells = [...oCard.querySelectorAll('tbody tr')].map(tr => ({
    label: tr.querySelector('th').textContent,
    value: parseFloat(tr.querySelector('td').textContent),
  }));
  const oRow = cells.find(c => /Operationality/.test(c.label));
  const parts = cells.filter(c => c.label.trim().startsWith('—') && Number.isFinite(c.value));
  const mean = parts.reduce((sum, c) => sum + c.value, 0) / parts.length;
  sayF(parts.length === 6, 'the card prints all six rubric parts');
  sayF(Math.abs(oRow.value - mean) < 0.02,
       'O equals the mean of its six parts: ' + oRow.value.toFixed(2) + ' vs ' + mean.toFixed(2));

  // --- coverage is reported twice, and the two cannot cross ----------------
  // Per-prediction coverage is what one repetition reached; pooled is what all
  // of them reached together. A union can never be smaller than the mean of its
  // members, so per-prediction <= pooled always, and the ratio is in [0, 1].
  d = await go('#view=single&mode=nodes&a=osm_pwg|gpt|ungrounded');
  const covTableRows = [...d.querySelectorAll('.card table.kv tbody tr')]
    .map(tr => ({ label: tr.querySelector('th').textContent,
                  cells: [...tr.querySelectorAll('td')].map(td => td.textContent) }));
  const covPerPred = covTableRows.find(r => /per prediction/i.test(r.label));
  const covPooled = covTableRows.find(r => /pooled/i.test(r.label));
  const covRatio = covTableRows.find(r => /^Ratio/.test(r.label));
  sayF(!!covPerPred && !!covPooled && !!covRatio, 'the rail reports coverage per prediction and pooled');
  const covNum = (text) => parseFloat(String(text).replace(/[^0-9.]/g, ''));
  const okOrder = covPerPred.cells.every((cell, i) => covNum(cell) <= covNum(covPooled.cells[i]) + 1e-9);
  sayF(okOrder, 'per-prediction coverage never exceeds pooled: '
       + covPerPred.cells.join('/') + ' vs ' + covPooled.cells.join('/'));
  sayF(covRatio.cells.every(c => covNum(c) > 0 && covNum(c) <= 1),
       'and their ratio is a share: ' + covRatio.cells.join(', '));

  // --- O belongs to the concept, not to the distribution -------------------
  // The defect this replaced: a node's O was the mean over whichever generated
  // concepts a run matched to it, so the same reference concept read one number
  // under baseline and another under grounded. Two distributions over one
  // reference must now hold identical O columns and differ in prevalence alone.
  d = await go('#view=compare&mode=nodes&a=osm_pwg|gpt|ungrounded&b=osm_pwg|gpt|grounded&sort=O&order=a');
  const charts = d.querySelectorAll('.chart .bars');
  sayF(charts.length === 2, 'two node charts for the comparison');
  const readCol = (list) => [...list.querySelectorAll('.bar')].map(b => ({
    name: b.querySelector('.bar-word').textContent,
    val: b.querySelector('.bar-val').textContent.trim(),
  }));
  const colA = readCol(charts[0]);
  const colB = readCol(charts[1]);
  const paired = colA.filter((x, i) => colB[i] && colB[i].name === x.name);
  sayF(paired.length > 5, 'the two charts hold the same concepts in the same rows (' + paired.length + ')');
  const sameO = paired.every((x, i) => x.val === colB[colA.indexOf(x)].val);
  sayF(sameO, 'the same concept reads the same O in both distributions');
  const prevalenceDiffers = await (async () => {
    const e = await go('#view=compare&mode=nodes&a=osm_pwg|gpt|ungrounded&b=osm_pwg|gpt|grounded&sort=prevalence&order=a');
    const cs = e.querySelectorAll('.chart .bars');
    const pa = readCol(cs[0]); const pb = readCol(cs[1]);
    return pa.some((x, i) => pb[i] && pb[i].name === x.name && pb[i].val !== x.val);
  })();
  sayF(prevalenceDiffers, 'while prevalence does differ between them — the comparison still says something');

  // --- sonification: the pair really is two voices -------------------------
  const { Sonifier } = await import('./js/sonify.js');
  const son = new Sonifier();
  son.enabled = true;
  son.baseHz = 196;

  const span = son.frequency(1) / son.frequency(0);
  say(Math.abs(span - 8) < 1e-6, 'pitch spans three octaves (' + span.toFixed(2) + 'x base)');
  say(son.frequency(0.5) > son.frequency(0.47), 'a 3-point difference is an audible step: '
      + (son.frequency(0.5) - son.frequency(0.47)).toFixed(1) + ' Hz at mid-scale');
  say(son.instruments.a !== son.instruments.b,
      'the two series default to different instruments: ' + son.instruments.a + ' / ' + son.instruments.b);

  // Render offline so the assertions run without an output device.
  const Offline = window.OfflineAudioContext || window.webkitOfflineAudioContext;
  son.context = new Offline(2, 44100, 44100);
  son.master = son.context.createGain();
  son.master.connect(son.context.destination);

  son.stereo = true;
  const pair = son.playPair(0.5, 0.5);
  say(pair.length === 2, 'a unison still schedules two voices, not one');
  say(pair[0].hz === pair[1].hz, 'both voices sit on the same absolute scale (' + pair[0].hz.toFixed(1) + ' Hz)');
  say(pair[0].instrument !== pair[1].instrument, 'they differ by timbre');
  say(pair[1].start > pair[0].start && (pair[1].start - pair[0].start) < 0.05,
      'B is nudged ' + Math.round((pair[1].start - pair[0].start) * 1000) + 'ms late — separate attacks, still one event');
  say(pair[0].panned && pair[1].panned, 'both are panned apart while a pair is sounding');

  const rendered = await son.context.startRendering();
  const left = rendered.getChannelData(0);
  const right = rendered.getChannelData(1);
  const energy = (buf) => { let t = 0; for (let i = 0; i < buf.length; i += 1) t += buf[i] * buf[i]; return t; };
  const [eL, eR] = [energy(left), energy(right)];
  const ratio = Math.max(eL, eR) / Math.max(1e-9, Math.min(eL, eR));
  say(eL > 1e-6 && eR > 1e-6, 'both channels carry signal (L ' + eL.toFixed(2) + ', R ' + eR.toFixed(2) + ')');
  say(ratio < 3, 'the two voices are within ' + ratio.toFixed(1) + 'x of each other — neither is buried');
  let differs = 0;
  for (let i = 0; i < left.length; i += 1) if (Math.abs(left[i] - right[i]) > 1e-4) differs += 1;
  say(differs > left.length * 0.1,
      'the channels are not the same waveform — ' + Math.round(100 * differs / left.length) + '% of samples differ');

  // voice selection
  son.voices = 'a';
  say(son.playPair(0.5, 0.5).length === 1 && son.playPair(0.5, 0.5)[0].series === 'a',
      'voices = A only sounds one voice, A');
  son.voices = 'b';
  const onlyB = son.playPair(0.5, 0.5);
  say(onlyB.length === 1 && onlyB[0].series === 'b', 'voices = B only sounds one voice, B');
  son.voices = 'both';
  say(son.playPair(0.5, 0.5).length === 2, 'voices = both is back to two');

  // an instrument demo sounds even while per-item tones are off
  son.enabled = false;
  const demo = son.demo('b');
  say(demo.length === 3, 'picking an instrument plays a three-note sample');
  say(demo.every((v) => v.instrument === son.instruments.b), 'the sample uses the instrument just picked');
  say(demo[1].start > demo[0].start && demo[2].start > demo[1].start, 'the sample rises through three notes');
  say(son.enabled === false, 'the sample does not leave per-item tones switched on');
  son.enabled = true;

  // pitch grids
  const sweep = (scale) => {
    son.scale = scale;
    const seen = new Set();
    for (let i = 0; i <= 2000; i += 1) seen.add(son.frequency(i / 2000).toFixed(4));
    return seen.size;
  };
  say(sweep('continuous') > 1500, 'continuous pitch is continuous (' + sweep('continuous') + ' distinct)');
  say(sweep('chromatic') === 37, 'chromatic snaps to 37 semitones over three octaves');
  say(sweep('pentatonic') === 16, 'pentatonic snaps to 16 degrees over three octaves');
  son.scale = 'pentatonic';
  const degrees = new Set();
  for (let i = 0; i <= 2000; i += 1) {
    const semis = Math.round(12 * Math.log2(son.frequency(i / 2000) / son.baseHz));
    degrees.add(((semis % 12) + 12) % 12);
  }
  say([...degrees].every((d) => [0, 2, 4, 7, 9].includes(d)),
      'every pentatonic pitch is a scale degree: ' + [...degrees].sort((a, b) => a - b).join(', '));
  son.scale = 'continuous';

  // A lone distribution belongs in the middle.
  son.context = new Offline(2, 44100, 22050);
  son.master = son.context.createGain();
  son.master.connect(son.context.destination);
  son.buses = new Map();
  son.stereo = false;
  const solo = son.play(0.5, 'a');
  say(!solo.panned, 'a single distribution is not panned');

  // --- coverage by accessibility category ---------------------------------
  d = await go('#view=single&mode=edges&a=osm_pwg|gpt|ungrounded&scope=all');
  const topics = [...d.querySelectorAll('.card--overview')]
    .find((el) => el.querySelector('summary').textContent.includes('accessibility category'));
  sayF(!!topics, 'the summary rail carries a per-category breakdown');
  sayF(topics.tagName === 'DETAILS' && !topics.open,
       'it is collapsed by default — a drill-down, not a headline');
  const topicRows = [...topics.querySelectorAll('tbody tr')];
  sayF(topicRows.length >= 9, 'one row per category (' + topicRows.length + ')');
  // Bikes and Transit have no osm_pwg reference edges. Reporting 0% coverage
  // there would say the run missed them; it says the reference is empty.
  const bikes = topicRows.find((tr) => tr.querySelector('th').textContent.trim() === 'Bikes');
  sayF(!!bikes && /no edges in the reference/.test(bikes.textContent),
       'a category with no reference edges says so rather than reading 0%');
  const sidewalks = topicRows.find((tr) => tr.querySelector('th').textContent.trim() === 'Sidewalks');
  const topicCells = [...sidewalks.querySelectorAll('td')].map((td) => td.textContent.trim());
  sayF(/^6/.test(topicCells[0]), 'Sidewalks carries the reference edge count: ' + topicCells[0]);
  const pooled = parseFloat(topicCells[1]);
  const perPred = parseFloat(topicCells[2]);
  sayF(Number.isFinite(pooled) && Number.isFinite(perPred) && perPred <= pooled + 1e-9,
       'per-prediction coverage never exceeds pooled (' + perPred + '% vs ' + pooled + '%)');

  // The category filter restricts the chart, and says so in the caption.
  d = await go('#view=single&mode=edges&a=osm_pwg|gpt|ungrounded&scope=topic:Tactile&unmatched=1');
  const scopeSel = d.getElementById('scopeSel');
  sayF(scopeSel.value === 'topic:Tactile', 'the scope control round-trips a category through the hash');
  sayF(/restricted to Tactile/.test(d.querySelector('.caption, figcaption, .stage-caption')?.textContent
       || d.querySelector('.stage-scroll').textContent), 'the caption names the restriction');
  const shown = [...d.querySelectorAll('.bar')];
  sayF(shown.length > 0 && shown.length < 53, 'the chart shows a subset: ' + shown.length + ' of 53 edges');

  // --- no live regions ----------------------------------------------------
  sayF(d.querySelectorAll('[aria-live]').length === 0, 'no aria-live regions in the page');

 } catch (err) { log.push('THREW ' + (err && err.stack || err)); }
  // A terminating marker, so a harness can wait for the suite instead of
  // sleeping a fixed number of seconds and reading whatever has arrived. A run
  // that adds assertions gets slower; without this line the extra time silently
  // truncates the tail and the run still looks like "0 failures".
  const passes = log.filter((line) => line.startsWith('PASS')).length;
  const fails = log.length - passes;
  log.push(`DONE ${passes} passed, ${fails} not passed`);
  flush();
  document.body.dataset.done = '1';
})();
setInterval(flush, 300);
</script>
